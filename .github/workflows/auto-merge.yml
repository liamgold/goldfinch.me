name: Auto-merge (label gate)

# Adding the `auto-merge` label to a PR is the approval. No agent is involved:
# this enables GitHub auto-merge (squash) so the PR merges as soon as the
# `PR Build` check is green and the branch is conflict-free. It never merges red.
#
# Requires the repository setting "Allow auto-merge" (Settings -> General ->
# Pull Requests). For the CI gate to hold, add `build` from pr-build.yml as a
# required status check on `main` in branch protection.
#
# See docs/routines/ai-pipeline.md.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: github.event.label.name == 'auto-merge'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body "🔀 Auto-merge enabled. This PR will squash-merge once required checks pass and there are no conflicts."
